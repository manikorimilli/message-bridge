spring.application.name=message-bridge
spring.config.import=optional:file:.env[.properties]

# Twilio settings come from the local .env file (or environment variables). Never put the real values in this file.
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.api-key=${TWILIO_API_KEY}
twilio.api-secret=${TWILIO_API_SECRET}
twilio.from-number=${TWILIO_FROM_NUMBER}

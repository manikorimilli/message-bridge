spring.application.name=message-bridge
spring.config.import=optional:file:.env[.properties]

# Hosting platforms (Render, Railway, ...) set PORT; locally the app uses 8080.
server.port=${PORT:8080}

# Which website may call the API from a browser, e.g. https://message-bridge-ui.vercel.app. "*" allows any.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Secrets come from the local .env file (or environment variables). Never put the real values in this file.
# The empty defaults let the app report a missing value by name at startup.
api.key=${API_KEY:}
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.api-key=${TWILIO_API_KEY:}
twilio.api-secret=${TWILIO_API_SECRET:}
twilio.from-number=${TWILIO_FROM_NUMBER:}
